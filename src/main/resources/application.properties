spring.application.name=focusflow-ai
spring.datasource.url=jdbc:mysql://localhost:3306/focusflow_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.expiration-ms=86400000
spring.ai.google.genai.chat.options.model=gemini-3.6-flash
# Why: the Vite dev server must be allowed to call the API during local development.
focusflow.cors.allowed-origins=http://localhost:5173
focusflow.replan.cron=0 0 23 * * *
focusflow.replan.zone=Asia/Kolkataq
server.port=${PORT:8080}